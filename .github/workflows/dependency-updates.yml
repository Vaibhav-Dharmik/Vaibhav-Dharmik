name: Dependency Updates

on:
  schedule:
    # Run every Monday at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-dependencies:
    name: Update Dependencies
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'site/package-lock.json'
          
      - name: Install dependencies
        working-directory: './site'
        run: npm ci
        
      - name: Check for updates
        working-directory: './site'
        run: |
          echo "Checking for outdated packages..."
          npm outdated || true
          
      - name: Update patch and minor versions
        working-directory: './site'
        run: |
          echo "Updating patch and minor versions..."
          npm update
          
      - name: Run security audit and fix
        working-directory: './site'
        run: |
          echo "Running security audit..."
          npm audit fix || true
          
      - name: Test build after updates
        working-directory: './site'
        run: |
          echo "Testing build with updated dependencies..."
          npm run build
          
      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "no_changes=true" >> $GITHUB_OUTPUT
          else
            echo "no_changes=false" >> $GITHUB_OUTPUT
          fi
          
      - name: Create Pull Request
        if: steps.changes.outputs.no_changes == 'false'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: update dependencies'
          title: '🔄 Automated Dependency Updates'
          body: |
            ## Automated Dependency Updates
            
            This PR contains automated updates to dependencies:
            
            - ⬆️ Updated patch and minor versions
            - 🔒 Applied security fixes
            - ✅ Build tested successfully
            
            **Changes made:**
            - Updated `package-lock.json`
            - Applied security patches where available
            
            Please review the changes and merge if everything looks good.
            
            ---
            
            🤖 This PR was created automatically by GitHub Actions
          branch: 'chore/dependency-updates'
          delete-branch: true
